# Veröffentlicht nur das fertige Spiel auf GitHub Pages.
# Doku (*.md), dev-data/ und .github/ landen NICHT auf der Website.
# Neue Dateien in css/ und js/ werden automatisch mitgenommen;
# neue Dateien im Hauptordner unten bei "cp" ergänzen.
name: Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Spieldateien sammeln
        run: |
          mkdir _site
          cp index.html manifest.json sw.js icon.svg icon-192.png icon-512.png _site/
          cp -r css js _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
